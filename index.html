<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood Tracker &amp; Jurnal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ffb7c5;
    --peach: #ffd1b3;
    --cream: #fff4e6;
    --mint: #bde9d0;
    --lav: #d9c7f2;
    --sky: #b5d8f7;
    --lemon: #fff0a8;
    --ink: #5b4b66;
    --ink2: #8a7a96;
    --card: #ffffff;
    --happy: #ffe79a;
    --good: #a8e6cf;
    --meh: #ffd7a0;
    --low: #f9b5c0;
    --awful: #c9b6e4;
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Quicksand", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.5) 2px, transparent 3px),
      radial-gradient(circle at 40% 60%, rgba(255,255,255,0.5) 2px, transparent 3px),
      radial-gradient(circle at 70% 30%, rgba(255,255,255,0.5) 2px, transparent 3px),
      radial-gradient(circle at 85% 75%, rgba(255,255,255,0.5) 2px, transparent 3px),
      radial-gradient(circle at 25% 85%, rgba(255,255,255,0.5) 2px, transparent 3px),
      radial-gradient(circle at 60% 8%, rgba(255,255,255,0.5) 2px, transparent 3px),
      radial-gradient(circle at 92% 50%, rgba(255,255,255,0.5) 2px, transparent 3px),
      radial-gradient(circle at 8% 55%, rgba(255,255,255,0.5) 2px, transparent 3px),
      radial-gradient(circle at 50% 95%, rgba(255,255,255,0.5) 2px, transparent 3px),
      linear-gradient(135deg, #ffe9ef 0%, #fff0e6 25%, #eaf6ef 50%, #e9effc 75%, #f3eafa 100%);
    background-size: 90px 90px, 110px 110px, 95px 95px, 105px 105px, 100px 100px, 115px 115px, 85px 85px, 108px 108px, 92px 92px, cover;
    padding: 28px 16px 70px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 26px; }
  header h1 {
    font-size: 2rem;
    font-weight: 700;
    display: inline-block;
    padding: 6px 22px;
    background: rgba(255,255,255,0.65);
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(214, 175, 199, 0.25);
  }
  header p { color: var(--ink2); margin-top: 10px; font-size: 0.98rem; font-weight: 500; }
  .card {
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(6px);
    border: 2px solid rgba(255,255,255,0.9);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 12px 30px rgba(203, 165, 199, 0.18);
  }
  .card h2 {
    font-size: 0.95rem;
    color: var(--ink2);
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
  }
  .moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .mood {
    background: #fff;
    border: 2px solid transparent;
    border-radius: 18px;
    padding: 14px 6px;
    text-align: center;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    box-shadow: 0 4px 12px rgba(203, 165, 199, 0.15);
  }
  .mood:hover { transform: translateY(-4px) rotate(-2deg); box-shadow: 0 8px 18px rgba(203, 165, 199, 0.28); }
  .mood.active {
    border-color: var(--pink);
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(255, 183, 197, 0.5);
  }
  .mood .emoji { font-size: 1.7rem; display: block; }
  .mood .label { font-size: 0.72rem; font-weight: 600; color: var(--ink2); margin-top: 7px; }
  .mood.active .label { color: var(--ink); }
  .note { display: flex; flex-direction: column; gap: 12px; }
  textarea {
    width: 100%;
    min-height: 105px;
    background: #fff;
    border: 2px solid #f3e3ee;
    border-radius: 16px;
    color: var(--ink);
    padding: 14px;
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
    box-shadow: inset 0 2px 6px rgba(214, 175, 199, 0.12);
  }
  textarea:focus { outline: none; border-color: var(--pink); }
  button {
    font-family: inherit;
    background: linear-gradient(135deg, var(--pink), #f69ec4);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 13px 20px;
    font-size: 0.98rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(246, 158, 196, 0.45);
    transition: transform .12s, filter .12s;
  }
  button:hover { filter: brightness(1.05); transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  button.secondary {
    background: #fff;
    color: var(--ink2);
    border: 2px solid #f3e3ee;
    box-shadow: none;
    padding: 8px 14px;
  }
  button.secondary:hover { border-color: var(--pink); color: var(--ink); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat {
    background: #fff;
    border-radius: 18px;
    padding: 16px 10px;
    text-align: center;
    box-shadow: 0 4px 14px rgba(203, 165, 199, 0.15);
  }
  .stat .num { font-size: 1.5rem; font-weight: 700; color: var(--pink); }
  .stat .name { font-size: 0.76rem; color: var(--ink2); font-weight: 600; margin-top: 5px; }
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
  .cal-head { text-align: center; font-size: 0.7rem; color: var(--ink2); font-weight: 700; text-transform: uppercase; padding: 4px 0; }
  .day {
    aspect-ratio: 1;
    background: #fff;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    box-shadow: 0 3px 10px rgba(203, 165, 199, 0.12);
    transition: transform .12s, box-shadow .12s;
  }
  .day:hover { transform: scale(1.08) rotate(-2deg); box-shadow: 0 6px 16px rgba(203, 165, 199, 0.3); }
  .day .dnum { font-size: 0.8rem; font-weight: 700; }
  .day .dmoji { font-size: 1rem; }
  .day.other { opacity: 0.25; }
  .day.today {
    border: 2px solid var(--pink);
    box-shadow: 0 0 0 3px rgba(255, 183, 197, 0.35);
  }
  .day.selected { border: 2px dashed var(--lav); }
  .journal-list { display: flex; flex-direction: column; gap: 12px; }
  .entry {
    background: #fff;
    border-radius: 18px;
    padding: 14px 16px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    box-shadow: 0 4px 14px rgba(203, 165, 199, 0.14);
  }
  .entry .emoji {
    font-size: 1.5rem;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    flex-shrink: 0;
  }
  .entry .body { flex: 1; min-width: 0; }
  .entry .date { font-size: 0.75rem; color: var(--ink2); font-weight: 700; }
  .entry .text { margin-top: 5px; font-size: 0.92rem; white-space: pre-wrap; word-break: break-word; }
  .entry .del {
    background: none;
    border: none;
    color: var(--ink2);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 4px 6px;
    box-shadow: none;
  }
  .entry .del:hover { color: #f0708f; background: none; transform: none; }
  .empty { color: var(--ink2); text-align: center; padding: 24px 0; font-size: 0.92rem; font-weight: 500; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .nav .month-label { font-size: 1.05rem; font-weight: 700; }
  .toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #fff;
    border: 2px solid var(--pink);
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink);
    box-shadow: 0 10px 28px rgba(246, 158, 196, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .mood-key { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 14px; font-size: 0.8rem; font-weight: 600; color: var(--ink2); }
  @media (max-width: 480px) {
    .stats { grid-template-columns: repeat(3, 1fr); }
    .mood .emoji { font-size: 1.4rem; }
    header h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>&#127770;&#65039; Mood Tracker &amp; Jurnal</h1>
    <p>Catat suasana hatimu setiap hari dan tulis jurnal singkat.</p>
  </header>

  <section class="card">
    <h2>Hari ini: <span id="todayLabel"></span></h2>
    <div class="moods" id="moodPicker"></div>
    <div style="height:16px"></div>
    <div class="note">
      <textarea id="noteInput" placeholder="Tuliskan jurnalmu hari ini... (opsional)"></textarea>
      <button id="saveBtn">Simpan</button>
    </div>
  </section>

  <section class="card">
    <h2>Ringkasan 7 Hari Terakhir</h2>
    <div class="stats" id="stats"></div>
    <div class="mood-key" id="moodKey"></div>
  </section>

  <section class="card">
    <h2>Kalender Suasana Hati</h2>
    <div class="nav">
      <button class="secondary" id="prevMonth">&larr;</button>
      <span class="month-label" id="monthLabel"></span>
      <button class="secondary" id="nextMonth">&rarr;</button>
    </div>
    <div class="calendar" id="calendar"></div>
  </section>

  <section class="card">
    <h2>Jurnal Terakhir</h2>
    <div class="journal-list" id="journalList"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const MOODS = [
  { key: "happy", emoji: "&#128513;", label: "Happy", color: "#ffe79a" },
  { key: "good",  emoji: "&#128578;", label: "Baik",  color: "#a8e6cf" },
  { key: "meh",   emoji: "&#128528;", label: "Biasa", color: "#ffd7a0" },
  { key: "low",   emoji: "&#128532;", label: "Sedih", color: "#f9b5c0" },
  { key: "awful", emoji: "&#128557;", label: "Hancur", color: "#c9b6e4" }
];

const MOOD_MAP = {};
MOODS.forEach(m => MOOD_MAP[m.key] = m);

const STORE_KEY = "moodJournalData";
const DAY_MS = 86400000;

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}
function saveData(data) {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function parseKey(k) {
  const [y, m, d] = k.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function todayKey() { return dateKey(new Date()); }

let data = loadData();
let selectedMood = (data[todayKey()] && data[todayKey()].mood) || null;
let currentMonth = new Date();
currentMonth.setDate(1);
let selectedDay = null;

const $ = (id) => document.getElementById(id);

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 1800);
}

function fmtDate(d) {
  return d.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

function initMoodPicker() {
  const picker = $("moodPicker");
  picker.innerHTML = "";
  MOODS.forEach(m => {
    const el = document.createElement("div");
    el.className = "mood" + (m.key === selectedMood ? " active" : "");
    el.innerHTML = `<span class="emoji">${m.emoji}</span><span class="label">${m.label}</span>`;
    el.addEventListener("click", () => {
      selectedMood = m.key;
      [...picker.children].forEach(c => c.classList.remove("active"));
      el.classList.add("active");
    });
    picker.appendChild(el);
  });
}

function updateTodayLabel() {
  $("todayLabel").textContent = fmtDate(new Date());
}

function renderStats() {
  const stats = $("stats");
  const entries = Object.entries(data).filter(([k]) => {
    const d = parseKey(k);
    return d <= new Date() && d > new Date(Date.now() - 7 * DAY_MS);
  });
  const moods7 = entries.filter(([, v]) => v.mood);
  const happy = moods7.filter(([, v]) => v.mood === "happy" || v.mood === "good").length;
  const avg = moods7.length
    ? MOODS.reduce((acc, m) => acc + MOODS.indexOf(m) * moods7.filter(([, v]) => v.mood === m.key).length, 0) / moods7.length
    : 0;
  const total = entries.length;
  const journaled = entries.filter(([, v]) => v.note).length;

  const items = [
    { num: happy + "/" + moods7.length, name: "Hari baik" },
    { num: Math.round(avg * 10) / 10, name: "Mood rata-rata" },
    { num: journaled + "/" + total, name: "Ada jurnal" }
  ];
  stats.innerHTML = items.map(s =>
    `<div class="stat"><div class="num">${s.num}</div><div class="name">${s.name}</div></div>`
  ).join("");
  const keyHtml = MOODS.map(m =>
    `<span style="color:${m.color}">${m.emoji} ${m.label}</span>`
  ).join(" ");
  $("moodKey").innerHTML = keyHtml;
}

function renderCalendar() {
  const cal = $("calendar");
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const monthLabel = currentMonth.toLocaleDateString("id-ID", { month: "long", year: "numeric" });
  $("monthLabel").textContent = monthLabel.charAt(0).toUpperCase() + monthLabel.slice(1);

  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // Senin = 0
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let html = "";
  const heads = ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"];
  heads.forEach(h => html += `<div class="cal-head">${h}</div>`);

  for (let i = startOffset - 1; i >= 0; i--) {
    const d = new Date(year, month, -i);
    html += dayCell(d, true);
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    html += dayCell(d, false);
  }
  const cells = startOffset + daysInMonth;
  let next = 1;
  while (cells + next <= 42) {
    const d = new Date(year, month + 1, next);
    html += dayCell(d, true);
    next++;
  }
  cal.innerHTML = html;
}

function dayCell(d, isOther) {
  const key = dateKey(d);
  const rec = data[key];
  const isToday = key === todayKey();
  const isSelected = selectedDay === key;
  const emoji = rec && rec.mood ? MOOD_MAP[rec.mood].emoji : "&#183;";
  let cls = "day";
  if (isOther) cls += " other";
  if (isToday) cls += " today";
  if (isSelected) cls += " selected";
  const bg = rec && rec.mood ? `background:${MOOD_MAP[rec.mood].color};` : "";
  return `<div class="${cls}" data-key="${key}" style="${bg}">
    <span class="dnum">${d.getDate()}</span>
    <span class="dmoji">${emoji}</span>
  </div>`;
}

function renderJournal() {
  const list = $("journalList");
  const keys = Object.keys(data)
    .filter(k => data[k] && data[k].note)
    .sort((a, b) => b.localeCompare(a))
    .slice(0, 10);
  if (!keys.length) {
    list.innerHTML = `<div class="empty">Belum ada jurnal. Mulai tulis catatan harianmu di atas. &#128172;</div>`;
    return;
  }
  list.innerHTML = "";
  keys.forEach(k => {
    const rec = data[k];
    const el = document.createElement("div");
    el.className = "entry";
    const moodEmoji = rec.mood ? MOOD_MAP[rec.mood].emoji : "&#128278;";
    const moodBg = rec.mood ? MOOD_MAP[rec.mood].color : "#f3e3ee";
    const d = parseKey(k);
    el.innerHTML = `
      <span class="emoji" style="background:${moodBg}">${moodEmoji}</span>
      <div class="body">
        <div class="date">${fmtDate(d)}</div>
        <div class="text"></div>
      </div>
      <button class="del" title="Hapus">&#10005;</button>
    `;
    el.querySelector(".text").textContent = rec.note;
    el.querySelector(".del").addEventListener("click", () => {
      if (!confirm("Hapus jurnal ini?")) return;
      delete data[k];
      saveData(data);
      renderAll();
      showToast("Jurnal dihapus");
    });
    list.appendChild(el);
  });
}

function renderAll() {
  updateTodayLabel();
  initMoodPicker();
  renderStats();
  renderCalendar();
  renderJournal();
}

$("saveBtn").addEventListener("click", () => {
  const note = $("noteInput").value.trim();
  if (!selectedMood && !note) { showToast("Pilih mood atau tulis jurnal dulu ya"); return; }
  const key = todayKey();
  data[key] = { mood: selectedMood, note: note || (data[key] && data[key].note) || "" };
  saveData(data);
  renderAll();
  showToast("Tersimpan! &#10003;");
});

$("prevMonth").addEventListener("click", () => {
  currentMonth.setMonth(currentMonth.getMonth() - 1);
  renderCalendar();
});
$("nextMonth").addEventListener("click", () => {
  currentMonth.setMonth(currentMonth.getMonth() + 1);
  renderCalendar();
});

$("calendar").addEventListener("click", (e) => {
  const cell = e.target.closest(".day");
  if (!cell) return;
  selectedDay = cell.dataset.key;
  renderCalendar();
  const rec = data[selectedDay];
  if (rec && rec.note) {
    showToast(`Jurnal ${fmtDate(parseKey(selectedDay))}: "${rec.note.length > 40 ? rec.note.slice(0, 40) + "..." : rec.note}"`);
  } else {
    showToast(fmtDate(parseKey(selectedDay)) + " - belum ada catatan");
  }
});

$("noteInput").value = (data[todayKey()] && data[todayKey()].note) || "";

renderAll();
</script>
</body>
</html>
